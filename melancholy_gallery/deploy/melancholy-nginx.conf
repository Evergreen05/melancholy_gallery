server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/melancholy_gallery/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /opt/melancholy_gallery/media/;
        expires 7d;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn-melancholy.sock;
        proxy_read_timeout 120;
    }
}
